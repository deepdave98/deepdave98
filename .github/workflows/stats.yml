name: Refresh stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      # The built-in token sees public work, which is what the profile graph
      # shows. A personal token in STATS_TOKEN with read:user also counts
      # private work.
      - run: |
          python3 scripts/stats.py
          git config user.name "Deep Dave"
          git config user.email "deepajaydave@gmail.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git diff --cached --quiet || git commit -m "Refresh stats"
          git push
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
